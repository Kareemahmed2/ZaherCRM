name: Competitor scan

# Weekly by default -- every Monday 06:00 UTC. Runs on GitHub's runners rather than
# Vercel because scripts/competitor_scan.py's only heavy dependency (Scrapling) hard-pulls
# in Playwright/Patchright (~214MB) even though it's never used, well over/at Vercel's
# serverless function size ceiling. See scripts/competitor_scan.py's docstring.
#
# Can also be run on demand -- either from the Actions tab, or triggered by the in-app
# "Check now" button via api/trigger-competitor-scan.js -- optionally scoped to one
# competitor via the competitor_id input, instead of the full weekly scan.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      competitor_id:
        description: 'Competitor ID to check (leave blank to scan all)'
        required: false
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # lets the automatic GITHUB_TOKEN commit research/roster.json below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: |
          python scripts/competitor_scan.py ${{ inputs.competitor_id && format('--competitor-id={0}', inputs.competitor_id) || '' }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # Regenerates research/roster.json from the current `competitors` table, so the weekly
      # Cowork research run always fetches a fresh baseline instead of a hand-maintained list
      # that goes stale the moment a scan (or anything else) writes to Supabase. See
      # research/ROSTER.md for the full loop this closes.
      - name: Export competitor roster
        # Only on the full weekly scan -- a single-competitor "Check now" run (competitor_id
        # set) would write a roster reflecting just that one row and clobber the real one.
        if: ${{ !inputs.competitor_id }}
        run: python scripts/export_roster.py
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit roster
        if: ${{ !inputs.competitor_id }}
        run: |
          set -euo pipefail
          git config user.name  "competitor-scan[bot]"
          git config user.email "competitor-scan@users.noreply.github.com"
          git add research/roster.json
          # generatedAt changes every run, so only commit when something real moved -- otherwise
          # every weekly run produces a no-op commit that's pure noise in the history.
          if git diff --cached --quiet -- research/roster.json; then
            echo "roster unchanged"; exit 0
          fi
          if [ "$(git diff --cached --numstat -- research/roster.json | awk '{print $1+$2}')" -le 2 ]; then
            echo "only the timestamp moved -- skipping commit"; git reset -- research/roster.json; exit 0
          fi
          # [skip ci] matters: apply-research.yml watches research/**, and a roster commit is
          # not a delta CSV -- without it the two workflows would ping-pong on every push.
          git commit -m "chore: refresh competitor roster [skip ci]"
          git push
