<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zaher CRM · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --gray-50:#F8F8F7;--gray-100:#F1F0EE;--gray-200:#E2E1DE;--gray-300:#C8C7C3;--gray-500:#888780;--gray-700:#444441;--gray-900:#1C1C1A;
    --white:#FFFFFF;--border:rgba(0,0,0,0.08);--border-med:rgba(0,0,0,0.14);
    --shadow-md:0 4px 12px rgba(0,0,0,0.08),0 2px 4px rgba(0,0,0,0.04);
    --r-sm:6px;--r-md:10px;--r-lg:14px;--font:'DM Sans',sans-serif;--font-mono:'DM Mono',monospace;
    --green-50:#EAF3DE;--green-600:#3B6D11;--green-hover:#2C5210;
    --red-50:#FCEBEB;--red-400:#E24B4A;
  }
  body{font-family:var(--font);background:var(--gray-50);color:var(--gray-900);min-height:100vh;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1.5;}
  .card{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:40px 32px;width:380px;text-align:center;}
  .logo{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--green-600);margin:0 auto 16px;}
  .logo svg{width:22px;height:22px;fill:white;}
  .title{font-size:17px;font-weight:600;margin-bottom:4px;}
  .sub{font-size:13px;color:var(--gray-500);margin-bottom:24px;line-height:1.5;}
  .form-group{margin-bottom:16px;text-align:left;}
  .form-label{display:block;font-size:12px;font-weight:500;color:var(--gray-700);margin-bottom:6px;}
  .form-input{width:100%;padding:8px 12px;border:1px solid var(--border-med);border-radius:var(--r-sm);font-family:var(--font);font-size:13px;color:var(--gray-900);outline:none;transition:border-color .12s;background:var(--white);}
  .form-input:focus{border-color:var(--green-600);box-shadow:0 0 0 3px var(--green-50);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border-radius:var(--r-sm);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .12s;}
  .btn-primary{color:white;background:var(--green-600);margin-top:8px;}
  .btn-primary:hover{background:var(--green-hover);}
  .btn-primary:disabled{opacity:.5;cursor:default;}
  .btn-ghost{background:transparent;color:var(--gray-700);border:1px solid var(--border-med);margin-top:10px;}
  .btn-ghost:hover{background:var(--gray-100);}
  .msg{display:none;margin-top:14px;font-size:12px;line-height:1.5;text-align:left;}
  .msg.error{color:var(--red-400);}
  .msg.show{display:block;}
  .result{display:none;text-align:left;margin-top:18px;padding:16px;background:var(--green-50);border-radius:var(--r-md);}
  .result.show{display:block;}
  .result-row{margin-bottom:10px;}
  .result-row:last-child{margin-bottom:0;}
  .result-label{font-size:10px;color:var(--gray-500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
  .result-val{font-family:var(--font-mono);font-size:13px;color:var(--gray-900);word-break:break-all;}
  .hint{font-size:11px;color:var(--gray-500);margin-top:12px;line-height:1.5;}
  .who{font-size:12px;color:var(--gray-500);margin-bottom:18px;}
  .who a{color:var(--green-600);cursor:pointer;text-decoration:none;}
  .who a:hover{text-decoration:underline;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="card" id="login-card">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M4 5h16l-9 8h9l-16 6 9-8H4z"/></svg></div>
  <div class="title">Zaher CRM · Admin</div>
  <div class="sub">Sign in with the admin account</div>
  <form id="login-form">
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="login-email" placeholder="you@zaher.ai" required></div>
    <div class="form-group" style="margin-bottom:8px;"><label class="form-label">Password</label><input class="form-input" type="password" id="login-password" required></div>
    <button class="btn btn-primary" type="submit" id="login-btn">Log in</button>
  </form>
  <div class="msg error" id="login-error"></div>
</div>

<!-- ADMIN PANEL (hidden until authorized) -->
<div class="card" id="admin-card" style="display:none;">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M4 5h16l-9 8h9l-16 6 9-8H4z"/></svg></div>
  <div class="title">Create account</div>
  <div class="who" id="admin-who"></div>
  <form id="create-form">
    <div class="form-group"><label class="form-label">Name</label><input class="form-input" type="text" id="create-name" placeholder="Teammate's name" required></div>
    <div class="form-group" style="margin-bottom:8px;"><label class="form-label">Email</label><input class="form-input" type="email" id="create-email" placeholder="teammate@zaher.ai" required></div>
    <button class="btn btn-primary" type="submit" id="create-btn">Create account</button>
  </form>
  <div class="msg error" id="create-error"></div>
  <div class="result" id="create-result">
    <div class="result-row"><div class="result-label">Email</div><div class="result-val" id="result-email"></div></div>
    <div class="result-row"><div class="result-label">Password</div><div class="result-val" id="result-password"></div></div>
    <div class="hint">Save or send these to them now — the password won't be shown again.</div>
  </div>
  <button class="btn btn-ghost" id="reset-btn" style="display:none;" onclick="resetForm()">Create another</button>
  <button class="btn btn-ghost" onclick="logOut()">Log out</button>
</div>

<script>
const SUPABASE_URL = 'https://lzztbjjbtpuyatyxbrke.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_j4touVNQEgeB9jdyaQHsMg_t_n9w_4S';
const ALLOWED_DOMAIN = 'zaher.ai';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function show(el){ el.classList.add('show'); }
function hide(el){ el.classList.remove('show'); }

async function handleSession(session){
  const loginCard=document.getElementById('login-card'), adminCard=document.getElementById('admin-card');
  const email=(session&&session.user&&session.user.email)||'';
  if(session && email.toLowerCase().endsWith('@'+ALLOWED_DOMAIN)){
    loginCard.style.display='none';
    adminCard.style.display='';
    document.getElementById('admin-who').textContent=`Logged in as ${email}`;
  } else {
    if(session) await sb.auth.signOut();
    loginCard.style.display='';
    adminCard.style.display='none';
  }
}

document.getElementById('login-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const errBox=document.getElementById('login-error'); hide(errBox);
  const email=document.getElementById('login-email').value.trim();
  const password=document.getElementById('login-password').value;
  const btn=document.getElementById('login-btn'); btn.disabled=true;
  try{
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error) throw error;
  }catch(err){
    errBox.textContent=err.message||'Something went wrong.';
    show(errBox);
  }
  btn.disabled=false;
});

document.getElementById('create-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const errBox=document.getElementById('create-error'); hide(errBox);
  hide(document.getElementById('create-result'));
  const name=document.getElementById('create-name').value.trim();
  const email=document.getElementById('create-email').value.trim();
  const btn=document.getElementById('create-btn'); btn.disabled=true;
  try{
    const {data:{session}}=await sb.auth.getSession();
    const res=await fetch('/api/admin-create-user',{
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':`Bearer ${session.access_token}`},
      body:JSON.stringify({name,email})
    });
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||`Request failed (${res.status})`);
    document.getElementById('result-email').textContent=data.email;
    document.getElementById('result-password').textContent=data.password;
    show(document.getElementById('create-result'));
    document.getElementById('create-form').style.display='none';
    document.getElementById('reset-btn').style.display='';
  }catch(err){
    errBox.textContent=err.message||'Something went wrong.';
    show(errBox);
  }
  btn.disabled=false;
});

function resetForm(){
  document.getElementById('create-form').reset();
  document.getElementById('create-form').style.display='';
  document.getElementById('reset-btn').style.display='none';
  hide(document.getElementById('create-result'));
  hide(document.getElementById('create-error'));
}
async function logOut(){ await sb.auth.signOut(); location.reload(); }

(async function init(){
  const {data:{session}}=await sb.auth.getSession();
  await handleSession(session);
  sb.auth.onAuthStateChange((_event,session)=>{ handleSession(session); });
})();
</script>
</body>
</html>
